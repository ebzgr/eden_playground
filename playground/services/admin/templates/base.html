<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}Admin{% endblock %} — Playground</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    /* Admin shell — keep overrides minimal so Bootstrap tokens apply */
    .pg-admin-sidebar {
      width: 16rem;
      min-height: 100vh;
    }
    .pg-admin-sidebar .nav-link {
      color: rgba(255, 255, 255, 0.85);
      border-radius: 0.375rem;
      padding: 0.5rem 0.75rem;
    }
    .pg-admin-sidebar .nav-link:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }
    .pg-admin-sidebar .nav-link.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.2);
      font-weight: 500;
    }
    .pg-admin-main {
      min-width: 0; /* allow table-responsive to shrink inside flex */
      background: var(--bs-tertiary-bg);
    }
    .table-events td.payload {
      max-width: 12rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--bs-font-monospace);
      font-size: 0.8rem;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-body-tertiary">
  <div class="d-flex min-vh-100">
    <aside class="pg-admin-sidebar flex-shrink-0 p-3 text-bg-dark">
      <a href="/admin/" class="d-flex align-items-center mb-3 text-white text-decoration-none">
        <span class="fs-5 fw-semibold">Playground</span>
      </a>
      <hr class="border-secondary opacity-50"/>
      <ul class="nav flex-column gap-1 mb-4">
        {% set path = request.url.path %}
        <li class="nav-item">
          <a class="nav-link{% if path == '/admin/' or path == '/admin' %} active{% endif %}" href="/admin/">
            <i class="bi bi-speedometer2 me-2"></i>Overview
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link{% if path.startswith('/admin/events') %} active{% endif %}" href="/admin/events">
            <i class="bi bi-list-ul me-2"></i>Events
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link{% if path.startswith('/admin/experiments') %} active{% endif %}" href="/admin/experiments">
            <i class="bi bi-bezier2 me-2"></i>Experiments
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link{% if path.startswith('/admin/worlds') %} active{% endif %}" href="/admin/worlds">
            <i class="bi bi-globe2 me-2"></i>Worlds
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link{% if path.startswith('/admin/users') %} active{% endif %}" href="/admin/users">
            <i class="bi bi-people me-2"></i>Users
          </a>
        </li>
      </ul>
    </aside>
    <main class="pg-admin-main flex-grow-1 p-4">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
