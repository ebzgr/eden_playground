<main class="consent-stage">
  <div class="consent-card">
    <h1 class="consent-title">Before we begin</h1>
    <p class="consent-lead">We log anonymous clicks to study how people learn about marketing influence. No email, no name — just a pseudonymous ID in your browser.</p>
    <a class="consent-readmore" href="/worlds/intro_world/scenes/about/view" target="_blank" rel="noopener">Read more about this research →</a>
    <label class="consent-check">
      <input type="checkbox" id="consent-checkbox"
             data-pg-event="consent_toggled"
             data-pg-payload='{"surface":"intro_consent"}'/>
      <span class="consent-agree">I agree to share this anonymous data for research.</span>
    </label>
    <button type="button" class="consent-start" id="btn-start">Start the experience</button>
  </div>
</main>
