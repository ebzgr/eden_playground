  # Nebula glow centered behind the verses
  - id: glow
    type: div
    class: letter-glow
    z: 1
    parallax: 0.25
    initial: { opacity: 0 }

verses:
  - id: intro
    text: "You have a letter from Mother Gaia.\nScroll to read it."
    style: caption
    position: center
  - id: c01
    text: |-
      Dear child, step inside,
      Here legends do reside.
    style: poem
    position: center
  - id: c02
    text: |-
      I want to tell you a real story,
      Listen with love and don't worry.
    style: poem
    position: center
  - id: c03
    text: |-
      Once upon a time in wonderland,
      All my children lived hand in hand.
    style: poem
    position: center
  - id: c04
    text: |-
      Science, poems, math, or art,
      They chased the songs of their heart.
    style: poem
    position: center
  - id: c05
    text: |-
      Until one day, one sad day,
      The greedy merchant came their way.
    style: poem
    position: center
  - id: c06
    text: |-
      With an army in his hold,
      All he cared for was more gold.
    style: poem
    position: center
  - id: c07
    text: |-
      All he cared for was his love
      To always be on top.
    style: poem
    position: center
  - id: c08
    text: |-
      Eager to reach this goal,
      He sold the devil his soul.
    style: poem
    position: center
  - id: c09
    text: |-
      Instead he received a book:
      "How to Keep a Mind on Hook"
    style: poem
    position: center
  - id: c10
    text: |-
      Filled with thousands of tricks
      To change the way a heart picks.
    style: poem
    position: center
  - id: c11
    text: |-
      With an army of soulless bots
      Taking control of my children.
    style: poem
    position: center
  - id: c12
    text: |-
      But lovely child, don't worry,
      Here comes the time for glory.
    style: poem
    position: center
  - id: c13
    text: |-
      To turn the dark back bright,
      I am raising an army of knights.
    style: poem
    position: center
  - id: c14
    text: |-
      Together we will pass this night
      And show the world what is right.
    style: poem
    position: center
  - id: c15
    text: |-
      If this letter touched your heart,
      Use this door — come stand by my side.
    style: poem
    position: center

# Each stanza occupies 0.075 of the timeline; consecutive stanzas overlap by 0.025
# (cadence 0.05). Verses rise from y: "30vh" (~80% from top of viewport) to
# y: "-30vh" (~20% from top), fading in over the first 0.009 and out over the
# last 0.009 of their range. The intro is visible at scroll 0 and shares the
# same exit pattern so it floats away as c01 rises into view.
timeline:
  # Ambience — soft nebula bloom (stars are visible from the start via layer initial)
  - { target: glow, at: 0.0, to: 0.08, kind: fade, props: { opacity: 0.7 } }

  # Intro — visible immediately, drifts upward as the user starts scrolling
  - { target: intro, at: 0.0,   kind: set,  props: { autoAlpha: 1, y: 0 } }
  - { target: intro, at: 0.0,   to: 0.075, kind: move, props: { y: "-30vh" } }
  - { target: intro, at: 0.066, to: 0.075, kind: hide, exit: none }

  # c01
  - { target: c01, at: 0.05,  kind: set,  props: { y: "30vh" } }
  - { target: c01, at: 0.05,  to: 0.059, kind: show, from: none }
  - { target: c01, at: 0.05,  to: 0.125, kind: move, props: { y: "-30vh" } }
  - { target: c01, at: 0.116, to: 0.125, kind: hide, exit: none }

