<main class="mw-stage mw-map">
  <div class="mw-panel">
    <h1 class="mw-map-title">Six Marketing Worlds</h1>
    <p class="mw-map-lead">Each door uses a different psychological trick. Pick one to step inside.</p>
    <p class="mw-map-hint">Every door is trying to lure you in with its own charm.</p>

    <div class="mw-doors" role="list">
      <button type="button" class="mw-door urgency" data-door="door_urgency" data-pg-event="map_door_urgency_clicked">
        <span class="mw-door-icon" aria-hidden="true">⚡</span>
        <span class="mw-door-badge">Limited time</span>
        <span class="mw-door-name">Urgency World</span>
        <span class="mw-door-desc">Act now or miss out forever.</span>
      </button>
      <button type="button" class="mw-door reward" data-door="door_reward" data-pg-event="map_door_reward_clicked">
        <span class="mw-door-icon" aria-hidden="true">🎮</span>
        <span class="mw-door-badge">Gold status</span>
        <span class="mw-door-name">Reward World</span>
        <span class="mw-door-desc">Unlimited rewards and status upgrades.</span>
      </button>
      <button type="button" class="mw-door social" data-door="door_social" data-pg-event="map_door_social_clicked">
        <span class="mw-door-icon" aria-hidden="true">👥</span>
        <span class="mw-door-badge">Most popular</span>
        <span class="mw-door-name">Social World</span>
        <span class="mw-door-desc">Join millions who already chose wisely.</span>
      </button>
      <button type="button" class="mw-door deal" data-door="door_deal" data-pg-event="map_door_deal_clicked">
        <span class="mw-door-icon" aria-hidden="true">💰</span>
        <span class="mw-door-badge">Save 100%</span>
        <span class="mw-door-name">Deal World</span>
        <span class="mw-door-desc">Was €99, now €0. Harry and save €99.</span>
      </button>
      <button type="button" class="mw-door framing" data-door="door_framing" data-pg-event="map_door_framing_clicked">
        <span class="mw-door-icon" aria-hidden="true">🖼️</span>
        <span class="mw-door-badge">Exclusive</span>
        <span class="mw-door-name">Framing World</span>
        <span class="mw-door-desc">We set the frame so you see things our way.</span>
      </button>
      <button type="button" class="mw-door persuasion" data-door="door_persuasion" data-pg-event="map_door_persuasion_clicked">
        <span class="mw-door-icon" aria-hidden="true">✨</span>
        <span class="mw-door-badge">Trending</span>
        <span class="mw-door-name">Persuasion World</span>
        <span class="mw-door-desc">Bright lights, big promises, irresistible offers.</span>
      </button>
    </div>
  </div>
</main>
