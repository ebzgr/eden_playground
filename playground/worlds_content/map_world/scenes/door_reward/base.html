<main class="mw-stage mw-door-scene">
  <div class="mw-panel">
    <button type="button" class="mw-back" id="btn-back-map" data-pg-event="door_back_to_map">← Back to map</button>
    <h1 class="mw-door-title">🎮 Gamification World</h1>
    <div class="mw-scores">
      <p>Total score: <strong id="total-score">0</strong></p>
      <p>Status: <strong id="player-status">Select</strong></p>
    </div>
    <button type="button" class="mw-action" id="btn-push" data-pg-event="door_reward_push">Push me!</button>
    <p class="mw-hint">Each push gives you 10 bonus points.</p>
    <p class="mw-bonus" id="bonus-flash" hidden>+10 points!</p>
  </div>
</main>
