<main class="mw-stage mw-door-scene">
  <div class="mw-panel">
    <button type="button" class="mw-back" id="btn-back-map" data-pg-event="door_back_to_map">← Back to map</button>
    <h1 class="mw-door-title">Exclusive members only</h1>
    <p class="mw-lead">This section is reserved for our luckiest members.</p>
    <div class="mw-roller" id="roller-display">
      <span class="mw-roller-text" id="roller-text">Roll to see if you win access</span>
      <span class="mw-roller-icon" id="roller-icon" aria-hidden="true">🎲</span>
    </div>
    <button type="button" class="mw-action" id="btn-roll" data-pg-event="door_framing_roll">Roll for access</button>
    <div class="mw-win" id="access-result" hidden>
      <p class="mw-crown" aria-hidden="true">👑</p>
      <h2>Congratulations!</h2>
      <p>You won access to the section. Welcome, exclusive member!</p>
    </div>
  </div>
</main>
